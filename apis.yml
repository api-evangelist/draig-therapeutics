aid: draig-therapeutics
name: Draig Therapeutics
description: >-
  Draig Therapeutics is a clinical-stage biopharmaceutical company developing
  transformative, best-in-class therapies for major neuropsychiatric disorders,
  including Major Depressive Disorder. A Cardiff University spinout co-founded
  with SV Health Investors, Draig ("dragon" in Welsh) leverages its founders'
  expertise in modulating the core glutamate/GABA pathways that underlie
  synaptic excitation and inhibition imbalance in the brain. Its pipeline is led
  by DT-101, a next-generation AMPA receptor positive allosteric modulator (PAM)
  advancing toward Phase 2 in MDD, alongside DT-201 and DT-301, subtype-selective
  GABAA receptor modulators. The company launched from stealth in June 2025 with
  a $140 million (£107 million) oversubscribed Series A led by Access
  Biotechnology, with participation from Canaan Partners, SR One, Sanofi Ventures,
  Schroders Capital, SV Health Investors, and ICG. Added to the API Evangelist
  network as a portfolio company of Canaan Partners.
